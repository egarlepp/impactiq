version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every codeql-action step (init, analyze) must run the same version, or
      # the analyze step fails, so they are always bumped together in one PR.
      codeql-action:
        patterns:
          - github/codeql-action*
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
