name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Code scanning is free on a public repository but needs the paid Code
    # Security add-on on a private one, where the upload step fails. Run only
    # when the repository is public. A scheduled run's payload carries no
    # repository object, so it is matched by name instead.
    if: >-
      (github.event_name == 'schedule' && github.repository == 'egarlepp/impactiq') ||
      (github.event_name != 'schedule' && github.event.repository.private == false)
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
          # Test files build throwaway Express apps and match error text with
          # loose regexes; they never ship, so they're left out of the scan.
          config: |
            threat-models: local
            paths-ignore:
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - tests/**
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          output: sarif-results
      # List every finding in the job log as well, so the results can be read
      # from the run without code-scanning API access.
      - name: List findings
        if: always()
        run: |
          shopt -s nullglob
          for f in sarif-results/*.sarif; do
            jq -r '.runs[].results[] | [.ruleId, (.locations[0].physicalLocation.artifactLocation.uri + ":" + ((.locations[0].physicalLocation.region.startLine // 0)|tostring)), (.message.text | gsub("\n"; " ") | .[0:200])] | @tsv' "$f"
          done
